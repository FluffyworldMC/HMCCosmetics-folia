# ============================================================================
# HMCCosmetics - Advanced Palette Dye Menu (ArtMap style)
# ============================================================================
# This menu is opened by the "Custom Color" button in
# menus/functional/internal_dye_menu.yml.
#
# It is a paginated palette. By default it uses 6 rows:
#
#   Row 1 (slots 0-8)  : [<] [ ] [ ] [ ] [Custom] [ ] [ ] [ ] [>]
#   Row 2 (slots 9-17) : [ ] [Input] [ ] [ ] [ ] [ ] [ ] [Output] [ ]
#   Row 3-6 (18-53)    : 36 color slots
#
# The input/output/custom/navigation slots can all be changed under "menu" and
# "custom-color" below.
#
# Every palette entry is generated from "base-colors" and "shades". With the
# default 4 shades, the 72 colors below become 288 palette entries (8 pages).
#
# Supported placeholders (MiniMessage is supported everywhere):
#   Palette items: {color_name} {shade_name} {shade} {hex} {hex_code} {color}
#                  {page} {pages}
#   Navigation:    {page} {pages} {target_page}
#   Title:         {page} {pages} {target_page} (title is set in config.yml,
#                  under dye-menu.title)
#
# {hex}      -> FF0000
# {hex_code} -> #FF0000
# {color}    -> #FF0000 (alias of {hex_code})
# {shade}    -> 0, 1, 2, ...
#
# Item sections (color-item, previous-item, next-item, filler, custom-color.item)
# accept resource pack model keys:
#   model-data: 10396                     <- integer CustomModelData
#   model-id: "my_items:color_swatch"     <- string item model (1.21.4+)
# ============================================================================

menu:
  # 1 to 6 rows.
  rows: 6
  # Slots for the cosmetic being dyed (input) and the preview (output).
  # Remove these two lines to fall back to dye-menu.input-slot / output-slot
  # in config.yml.
  input-slot: 10
  output-slot: 16
  # First slot used by the palette. Colors fill consecutive slots from here.
  color-start-slot: 18
  # How many colors are shown per page.
  color-page-size: 36
  # Navigation buttons. Set a slot to -1 to hide it.
  previous-slot: 0
  next-slot: 8

  previous-item:
    material: MAGENTA_GLAZED_TERRACOTTA
    name: "<red><bold><<</bold>"
    lore:
      - "<gray>Page {target_page}/{pages}"
  next-item:
    material: MAGENTA_GLAZED_TERRACOTTA
    name: "<green><bold>>></bold>"
    lore:
      - "<gray>Page {target_page}/{pages}"
  previous-disabled:
    material: GRAY_STAINED_GLASS_PANE
    name: " "
  next-disabled:
    material: GRAY_STAINED_GLASS_PANE
    name: " "
  # Optional item used to fill the empty palette slots. Remove this section to
  # leave the slots empty instead. Use material: AIR to do the same.
  filler:
    material: GRAY_STAINED_GLASS_PANE
    name: " "

# The template used for every color entry. If material is not provided (or is
# AIR), the cosmetic being dyed is used as the palette icon instead. Hook items
# work too, e.g. "material: nexo:paintbrush" or "material: itemsadder:hmccosmetics:paintbrush".
#
# Resource pack model:
#   model-data: 10396                        <- integer CustomModelData
#   model-id: "my_items:color_swatch"        <- string item model (1.21.4+)
color-item:
  material: LEATHER_HORSE_ARMOR
  # model-data: 10396
  name: "<#{hex}>{color_name} {shade_name}"
  lore:
    - "<gray>Hex: <white>#{hex}"
    - "<gray>Shade: <white>{shade_name}"
    - "<gray>Click to preview"

# Shades generated for every base color. The RGB value is multiplied by the
# factor and clamped to 0-255, exactly like ArtMap does.
# Remove this section to use these defaults.
shades:
  - name: "Dark"
    factor: 0.55
  - name: "Dim"
    factor: 0.75
  - name: "Base"
    factor: 1.0
  - name: "Light"
    factor: 1.25

# Base colors, in the order they are shown in the menu.
